# Click To Chat Manager — Nginx front-controller configuration
#
# Install: merge into your active server block for this app.
# Test:    sudo nginx -t
# Reload:  sudo systemctl reload nginx
#
# Adapt server_name, root, and fastcgi_pass to match your server.
# HTTPS params below suit Cloudflare (or similar) terminating TLS in front.

server {
    listen 80;
    server_name ctc.chatfromforms.com;

    root /var/www/ctc/whatsapp-widget-manager;
    index index.php;

    location ^~ /assets/ {
        try_files $uri =404;
        access_log off;
        expires 7d;
    }

    # Public widget endpoints — stay direct .php, never routed through index.php
    location ~ ^/(embed\.js\.php|widget\.php|save-widget-lead\.php|resolve-widget-destination\.php)$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_param SERVER_PORT 443;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_pass unix:/run/php-fpm/www.sock;
    }

    # Existing files first; otherwise route through index.php front controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_param SERVER_PORT 443;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_pass unix:/run/php-fpm/www.sock;
    }

    # Legacy direct .php access (GET/HEAD canonical redirects handled in PHP)
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_param SERVER_PORT 443;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_pass unix:/run/php-fpm/www.sock;
    }

    location ~ /\. {
        deny all;
    }
}
