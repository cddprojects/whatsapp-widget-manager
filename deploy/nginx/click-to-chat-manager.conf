# Click To Chat Manager — Nginx clean URL configuration
#
# Install: copy into your Nginx server block or include from conf.d.
# Test:    sudo nginx -t
# Reload:  sudo systemctl reload nginx
#
# Adapt fastcgi_pass and root to match your server.

server {
    listen 80;
    server_name example.com;
    root /var/www/click-to-chat-manager;
    index index.php;

    # Static assets
    location ^~ /assets/ {
        try_files $uri =404;
        access_log off;
        expires 7d;
    }

    # Public widget endpoints — never redirect to clean URLs
    location ~ ^/(embed\.js\.php|widget\.php|save-widget-lead\.php|resolve-widget-destination\.php)$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Slug aliases that do not match the PHP filename
    location = /clients {
        rewrite ^ /admin-clients.php last;
    }

    location = /manage-client {
        rewrite ^ /admin-client-detail.php last;
    }

    # Redirect mapped legacy .php filenames to their clean slugs
    location ~ ^/admin-clients\.php$ {
        if ($request_method ~ ^(GET|HEAD)$) {
            return 301 /clients$is_args$args;
        }

        include fastcgi_params;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ ^/admin-client-detail\.php$ {
        if ($request_method ~ ^(GET|HEAD)$) {
            return 301 /manage-client$is_args$args;
        }

        include fastcgi_params;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Redirect GET/HEAD .php app pages to clean URLs (preserve query string)
    location ~ ^/(login|logout|register|dashboard|admin-client-create|admin-client-edit|admin-client-delete|admin-client-reset-password|admin-client-leads|admin-settings|admin-widgets|all-leads|lead-recycle-bin|client-dashboard|client-leads|create-widget|edit-widget|edit-widget-phone|embed-code|widget-preview|set-language|upload-phone-numbers|update-phone-numbers|delete-lead|restore-lead|permanently-delete-lead|bulk-delete-leads|bulk-restore-leads|bulk-permanently-delete-leads|export-leads|export-widget-leads)\.php$ {
        if ($request_method ~ ^(GET|HEAD)$) {
            return 301 /$1$is_args$args;
        }

        include fastcgi_params;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Clean URL routing — internally rewrite to matching .php file
    location / {
        try_files $uri $uri/ $uri.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
